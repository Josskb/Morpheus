version: "3.9"

services:
  # ── PostgreSQL (prod backend) ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_prod_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application principale ─────────────────────────────────────
  radar:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: financial-radar
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar_prod_pass}@postgres:5432/${POSTGRES_DB:-radar}
    volumes:
      - ./logs:/app/logs           # logs rotatifs
      - ./models:/app/models       # modèles ML entraînés
      - ./config:/app/config:ro    # config en lecture seule
    ports:
      - "8000:8000"                # API FastAPI
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; from src.core.database import init_db; asyncio.run(init_db())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Dashboard React (prod) ─────────────────────────────────────
  # dashboard:
  #   build:
  #     context: ./src/dashboard/frontend
  #     dockerfile: Dockerfile
  #   container_name: radar-dashboard
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - radar

volumes:
  postgres_data:
