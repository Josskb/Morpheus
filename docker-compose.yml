version: "3.9"

services:
  # ── Application principale ─────────────────────────────────────
  radar:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: financial-radar
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data           # persistance SQLite
      - ./logs:/app/logs           # logs rotatifs
      - ./models:/app/models       # modèles ML entraînés
      - ./config:/app/config:ro    # config en lecture seule
    ports:
      - "8000:8000"                # API FastAPI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

