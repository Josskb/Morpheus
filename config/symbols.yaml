# ══════════════════════════════════════════════════════════════════
#  symbols.yaml — Symboles StockTwits à surveiller
#  Contrairement à accounts.yaml (comptes Twitter), ici "username" est
#  un symbole StockTwits : format "SYMBOL.X" pour la crypto, ticker
#  simple pour les actions.
# ══════════════════════════════════════════════════════════════════

accounts:
  # ── Crypto (format StockTwits : SYMBOL.X) ───────────────────────
  - username: BTC.X
    display_name: "Bitcoin"
    markets: [crypto]
    tags: [stocktwits]
    priority: high
    enabled: true

  - username: ETH.X
    display_name: "Ethereum"
    markets: [crypto]
    tags: [stocktwits]
    priority: high
    enabled: true

  - username: SOL.X
    display_name: "Solana"
    markets: [crypto]
    tags: [stocktwits]
    priority: medium
    enabled: true

  # ── Stocks ────────────────────────────────────────────────────
  - username: AAPL
    display_name: "Apple"
    markets: [stocks]
    tags: [stocktwits]
    priority: medium
    enabled: true

  - username: TSLA
    display_name: "Tesla"
    markets: [stocks]
    tags: [stocktwits]
    priority: medium
    enabled: true

  # ── Template pour ajouter un symbole ───────────────────────────
  # - username: SYMBOL                 # crypto: "BTC.X" | stock: "AAPL"
  #   display_name: "Nom Affiché"
  #   markets: [crypto]                # crypto | stocks
  #   tags: [stocktwits]
  #   priority: medium                 # high | medium | low
  #   enabled: true

# ── Paramètres de polling ──────────────────────────────────────
polling:
  interval_seconds: 300
  tweets_per_account: 10
  lookback_hours: 24

# ── Filtres globaux ───────────────────────────────────────────────
filters:
  exclude_retweets: true
  exclude_replies: false
  min_length: 10
  languages: []   # StockTwits ne fournit pas de langue — pas de filtre
