target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # certains blocs de commentaires ASCII dépassent volontairement

[lint.isort]
known-first-party = ["src"]

[lint.per-file-ignores]
"main.py" = ["E402"]  # setup_logging() doit s'exécuter avant les autres imports
