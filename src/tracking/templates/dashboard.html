<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Radar - Trade Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            padding: 1.5rem 0;
            border-bottom: 2px solid #3b82f6;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #60a5fa;
            margin: 0.5rem 0;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card.positive {
            border-color: #10b981;
        }

        .stat-value.positive {
            color: #10b981;
        }

        .stat-card.negative {
            border-color: #ef4444;
        }

        .stat-value.negative {
            color: #ef4444;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #334155;
            overflow-x: auto;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .tab.active {
            color: #60a5fa;
            border-bottom: 2px solid #60a5fa;
            margin-bottom: -2px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .alerts-list, .trades-list {
            display: grid;
            gap: 1rem;
        }

        .alert-card, .trade-card {
            background: #1e293b;
            border-left: 4px solid #60a5fa;
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .alert-card:hover, .trade-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .ticker {
            font-size: 1.3rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .trader-name {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .score-badge {
            background: #3b82f6;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .score-high {
            background: #10b981;
        }

        .score-medium {
            background: #f59e0b;
        }

        .score-low {
            background: #ef4444;
        }

        .alert-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .detail {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #64748b;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .detail-value {
            color: #e2e8f0;
            font-weight: 500;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .action-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-closed {
            background: #dcfce7;
            color: #166534;
        }

        .status-loss {
            background: #fee2e2;
            color: #991b1b;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #334155;
            animation: slideUp 0.3s;
        }

        .modal-header {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }

        .loading.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0.75rem;
            }

            h1 {
                font-size: 1.3rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .alert-details {
                grid-template-columns: 1fr;
            }

            .action-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📊 Trade Tracker</h1>
            <p class="subtitle">Monitor and track results from Financial Radar alerts</p>
        </div>
    </header>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Trades</div>
                <div class="stat-value" id="totalTrades">-</div>
            </div>
            <div class="stat-card positive">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value positive" id="winRate">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Result</div>
                <div class="stat-value" id="avgResult">-</div>
            </div>
            <div class="stat-card positive">
                <div class="stat-label">Total ROI</div>
                <div class="stat-value positive" id="totalRoi">-</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('alerts')">📢 Recent Alerts</button>
            <button class="tab" onclick="switchTab('active')">📈 Active Trades</button>
            <button class="tab" onclick="switchTab('closed')">✅ Closed Trades</button>
        </div>

        <!-- Alerts Tab -->
        <div id="alerts" class="tab-content active">
            <div class="loading show" id="alertsLoading">Loading alerts...</div>
            <div class="alerts-list" id="alertsList"></div>
        </div>

        <!-- Active Trades Tab -->
        <div id="active" class="tab-content">
            <div class="loading show" id="activeLoading">Loading active trades...</div>
            <div class="trades-list" id="activeList"></div>
        </div>

        <!-- Closed Trades Tab -->
        <div id="closed" class="tab-content">
            <div class="loading show" id="closedLoading">Loading closed trades...</div>
            <div class="trades-list" id="closedList"></div>
        </div>
    </div>

    <!-- Trade Modal -->
    <div id="tradeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Accept Alert</div>
            <form id="tradeForm">
                <div class="form-group">
                    <label>Entry Price *</label>
                    <input type="number" id="entryPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Target Price (optional)</label>
                    <input type="number" id="targetPrice" step="0.01">
                </div>
                <div class="form-group">
                    <label>Stop Loss (optional)</label>
                    <input type="number" id="stopLoss" step="0.01">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <input type="text" id="tradeNotes" placeholder="Any notes about this trade...">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-success">Accept Trade</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Update Price Modal -->
    <div id="updateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Update Trade Price</div>
            <form id="updateForm">
                <div class="form-group">
                    <label>Current Price *</label>
                    <input type="number" id="currentPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Notes (optional)</label>
                    <input type="text" id="updateNotes">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="closeUpdateModal()">Cancel</button>
                    <button type="submit" class="btn btn-success">Update</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentAlertId = null;
        let currentTradeId = null;

        async function loadData() {
            await Promise.all([loadStats(), loadAlerts(), loadTrades()]);
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.success) {
                    const s = data.stats;
                    document.getElementById('totalTrades').textContent = s.total_trades;
                    document.getElementById('winRate').textContent = s.win_rate.toFixed(1) + '%';
                    document.getElementById('avgResult').textContent = (s.avg_result_pct || 0).toFixed(2) + '%';
                    document.getElementById('totalRoi').textContent = (s.total_roi_pct || 0).toFixed(2) + '%';
                }
            } catch (e) {
                console.error('Error loading stats:', e);
            }
        }

        async function loadAlerts() {
            try {
                const res = await fetch('/api/alerts');
                const data = await res.json();
                document.getElementById('alertsLoading').classList.remove('show');

                if (data.success) {
                    const html = data.alerts.map(alert => `
                        <div class="alert-card">
                            <div class="alert-header">
                                <span class="ticker">${alert.ticker || 'N/A'}</span>
                                <span class="trader-name">@${alert.username}</span>
                                <span class="score-badge score-${getScoreClass(alert.hybrid_score)}">
                                    ${(alert.hybrid_score || 0).toFixed(2)}
                                </span>
                            </div>
                            <div class="alert-details">
                                <div class="detail">
                                    <span class="detail-label">Hybrid Score</span>
                                    <span class="detail-value">${(alert.hybrid_score || 0).toFixed(3)}</span>
                                </div>
                                <div class="detail">
                                    <span class="detail-label">NLP</span>
                                    <span class="detail-value">${(alert.nlp_score || 0).toFixed(2)}</span>
                                </div>
                                <div class="detail">
                                    <span class="detail-label">ML</span>
                                    <span class="detail-value">${(alert.ml_score || 0).toFixed(2)}</span>
                                </div>
                                <div class="detail">
                                    <span class="detail-label">Win Rate</span>
                                    <span class="detail-value">${(alert.account_win_rate * 100 || 0).toFixed(0)}%</span>
                                </div>
                            </div>
                            <div class="action-row">
                                <button class="btn btn-primary" onclick="openTradeModal('${alert.alert_id}', '${alert.ticker}')">
                                    Accept & Trade
                                </button>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('alertsList').innerHTML = html || '<p style="padding: 2rem;">No alerts yet</p>';
                }
            } catch (e) {
                console.error('Error loading alerts:', e);
            }
        }

        async function loadTrades() {
            try {
                // Active trades
                const activeRes = await fetch('/api/trades?status=active');
                const activeData = await activeRes.json();
                document.getElementById('activeLoading').classList.remove('show');

                if (activeData.success) {
                    const html = activeData.trades.map(trade => renderTradeCard(trade, true)).join('');
                    document.getElementById('activeList').innerHTML = html || '<p style="padding: 2rem;">No active trades</p>';
                }

                // Closed trades
                const closedRes = await fetch('/api/trades?status=closed');
                const closedData = await closedRes.json();
                document.getElementById('closedLoading').classList.remove('show');

                if (closedData.success) {
                    const html = closedData.trades.map(trade => renderTradeCard(trade, false)).join('');
                    document.getElementById('closedList').innerHTML = html || '<p style="padding: 2rem;">No closed trades</p>';
                }
            } catch (e) {
                console.error('Error loading trades:', e);
            }
        }

        function renderTradeCard(trade, isActive) {
            const resultClass = (trade.result_pct || 0) >= 0 ? 'positive' : 'negative';
            const resultSign = (trade.result_pct || 0) >= 0 ? '+' : '';

            return `
                <div class="trade-card">
                    <div class="alert-header">
                        <span class="ticker">${trade.ticker}</span>
                        <span class="trader-name">@${trade.username}</span>
                        <span class="status-badge status-${isActive ? 'active' : 'closed'}">
                            ${isActive ? 'ACTIVE' : 'CLOSED'}
                        </span>
                    </div>
                    <div class="alert-details">
                        <div class="detail">
                            <span class="detail-label">Entry</span>
                            <span class="detail-value">${trade.entry_price?.toFixed(2) || 'N/A'}</span>
                        </div>
                        <div class="detail">
                            <span class="detail-label">Target</span>
                            <span class="detail-value">${trade.target_price?.toFixed(2) || '-'}</span>
                        </div>
                        <div class="detail">
                            <span class="detail-label">Stop</span>
                            <span class="detail-value">${trade.stop_loss?.toFixed(2) || '-'}</span>
                        </div>
                        <div class="detail">
                            <span class="detail-label">Result</span>
                            <span class="detail-value ${resultClass}">${resultSign}${(trade.result_pct || 0).toFixed(2)}%</span>
                        </div>
                    </div>
                    ${isActive ? `
                        <div class="action-row">
                            <button class="btn btn-primary" onclick="openUpdateModal(${trade.id})">
                                Update Price
                            </button>
                            <button class="btn btn-success" onclick="openCloseModal(${trade.id})">
                                Close Trade
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function getScoreClass(score) {
            if (score >= 0.7) return 'high';
            if (score >= 0.5) return 'medium';
            return 'low';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function openTradeModal(alertId, ticker) {
            currentAlertId = alertId;
            document.getElementById('modalTitle').textContent = `Accept Trade: ${ticker}`;
            document.getElementById('tradeForm').reset();
            document.getElementById('tradeModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('tradeModal').classList.remove('show');
            currentAlertId = null;
        }

        document.getElementById('tradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const entry = parseFloat(document.getElementById('entryPrice').value);
            const target = document.getElementById('targetPrice').value ? parseFloat(document.getElementById('targetPrice').value) : null;
            const stop = document.getElementById('stopLoss').value ? parseFloat(document.getElementById('stopLoss').value) : null;
            const notes = document.getElementById('tradeNotes').value;

            try {
                const res = await fetch('/api/trades', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        alert_id: currentAlertId,
                        entry_price: entry,
                        target_price: target,
                        stop_loss: stop,
                        notes: notes
                    })
                });

                const data = await res.json();
                if (data.success) {
                    closeModal();
                    alert('Trade created! #' + data.trade_id);
                    loadTrades();
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        });

        function openUpdateModal(tradeId) {
            currentTradeId = tradeId;
            document.getElementById('updateModal').classList.add('show');
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.remove('show');
            currentTradeId = null;
        }

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const price = parseFloat(document.getElementById('currentPrice').value);
            const notes = document.getElementById('updateNotes').value;

            try {
                const res = await fetch(`/api/trades/${currentTradeId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_price: price, notes: notes })
                });

                if (res.ok) {
                    closeUpdateModal();
                    loadTrades();
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        });

        function openCloseModal(tradeId) {
            currentTradeId = tradeId;
            // Reuse update modal for close
            document.getElementById('updateModal').classList.add('show');
            document.getElementById('updateForm').onsubmit = async (e) => {
                e.preventDefault();
                const price = parseFloat(document.getElementById('currentPrice').value);
                const notes = document.getElementById('updateNotes').value;

                try {
                    const res = await fetch(`/api/trades/${currentTradeId}/close`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ final_price: price, notes: notes })
                    });

                    if (res.ok) {
                        closeUpdateModal();
                        loadData();
                    }
                } catch (e) {
                    alert('Error: ' + e.message);
                }
            };
        }

        // Load data on page load and refresh every 30 seconds
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
